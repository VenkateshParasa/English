# Netlify configuration for the English Learning Portal (static PWA, no build step)

[build]
  # Site is plain static files served from the repository root.
  publish = "."
  command = ""

  [build.environment]
    # Netlify installs dependencies whenever it sees a package.json, even with an
    # empty build command. This site needs NONE of them: `dependencies` in
    # package.json is empty, and jest / jest-environment-jsdom / http-server are
    # all devDependencies used only for local testing. So `--omit=dev` makes the
    # install a no-op and fetches nothing at all.
    #
    # This is belt and braces, not the fix. The actual failure was 48 lockfile
    # entries resolved to artifacts.apple.com and npm.apple.com — hosts that do
    # not exist off the corporate network — which failed the deploy with
    # ENOTFOUND; those URLs have been rewritten to the public registry and
    # .npmrc pins it. But a deploy of a static site should not be able to break
    # because of a test-only dependency tree at all, so it no longer downloads
    # one. It also takes ~90 seconds off every build.
    #
    # If a real runtime dependency is ever added, this line must go, or it will
    # be missing in production while working locally.
    NPM_FLAGS = "--omit=dev"

# Ignore folders that should never ship to production.
# (node_modules / coverage are also covered by .gitignore.)

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# Serve the 32x32 PNG for the implicit /favicon.ico request browsers make,
# avoiding a 404 (we declare icons via <link> tags, so no .ico file exists).
[[redirects]]
  from = "/favicon.ico"
  to = "/icons/icon-32x32.png"
  status = 200

# ---------------------------------------------------------------------------
# Security headers (applied to every route)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone=(self) is load-bearing, not boilerplate. This app needs the mic
    # for SpeechRecognition (app.js startRecognition) and MediaRecorder
    # (getUserMedia({audio:true})). An empty allowlist -- microphone=() -- denies
    # the feature to ALL origins including our own, which silently kills the
    # entire Listening & Speaking strand in production while working fine on
    # localhost. Camera and geolocation stay denied: the app never uses them.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(self)"
    X-XSS-Protection = "1; mode=block"

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------

# The service worker must never be cached, otherwise clients get stuck on an
# old worker and stop receiving updates.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep the manifest fresh so PWA metadata updates propagate.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML should always be revalidated so deployments are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-lived caching for immutable image assets.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS filenames are not content-hashed, so revalidate on each load
# (cheap 304s via ETag) to guarantee new deploys are picked up immediately.
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
