<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <title>Offline — English Learning Portal</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #66BB6A 0%, #43A047 100%);
            color: #fff;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 48px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }
        .icon { font-size: 64px; line-height: 1; margin-bottom: 16px; }
        h1 { font-size: 1.6rem; margin-bottom: 12px; }
        p { font-size: 1rem; line-height: 1.6; opacity: 0.92; margin-bottom: 28px; }
        button {
            font: inherit;
            font-weight: 600;
            color: #2E7D32;
            background: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="card" role="alert" aria-live="assertive">
        <div class="icon" aria-hidden="true">📡</div>
        <h1>You're offline</h1>
        <p>It looks like you've lost your internet connection. Some features may be unavailable, but your saved progress is safe. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
    <script>
        // Auto-reload once the connection is restored.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
