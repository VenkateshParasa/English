name: CI/CD Pipeline

on:
  push:
    branches: [ main, test, develop ]
  pull_request:
    branches: [ main, test, develop ]

# ---------------------------------------------------------------------------
# TEST JOB DISABLED — 2026-09-09, still disabled 2026-09-12 BY CHOICE
#
# The `test` job is commented out rather than deleted, so restoring it is a
# matter of removing the comment markers.
#
# It was originally disabled because it could not pass, for two independent
# reasons. BOTH ARE NOW FIXED (US-001):
#
#   1. `npm ci` requires a committed package-lock.json, and the lockfile was
#      gitignored — so every job failed at "Install dependencies", including
#      build and deploy, which is why GitHub Pages deployment was also blocked.
#      FIXED: the lockfile is no longer ignored. See the comment in .gitignore.
#   2. `jest` was not in devDependencies (only http-server was), so even with a
#      lockfile, `npm run test:unit` / `test:integration` / `npm test` would
#      all fail with "jest: not found".
#      FIXED: jest@30 and jest-environment-jsdom are declared and installed.
#
# So the reason it stays off is no longer technical: the owner asked for it off
# while the suites were still churning. `npm test` passes locally, so re-enabling
# it should now be a one-line change rather than a project.
#
# Deliberately no test count or coverage figure here. The first version of this
# comment quoted "112 unit assertions"; the second quoted "1046 tests, 77.4%".
# Both were stale within a wave. Run `npm test` for the current number.
# TO RESTORE:
#   - uncomment the test job below
#   - add `needs: test` back to the build job
#
# Until then the unit suites exist but nothing runs them on push, so a regression
# reaches main unchallenged. The syntax-check job below is a deliberately minimal
# stand-in, not a replacement.
# ---------------------------------------------------------------------------

jobs:
  # Zero-dependency safety net. Not a substitute for the unit suites — it only
  # proves the JavaScript parses, which is exactly the class of mistake that
  # would otherwise reach production unnoticed now that tests are off.
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Check every tracked JavaScript file parses
      run: |
        set -e
        for f in $(git ls-files '*.js' ':!:__tests__/legacy/*'); do
          node --check "$f"
        done
        echo "All tracked .js files parse."

  # ---------------------------------------------------------------------------
  # US-811 / NFR-13 / FR-CNT-1: content validation, and it actually runs.
  #
  # Deliberately NOT another commented-out block. It needs no browser, no jest
  # and NO DEPENDENCIES AT ALL — `node tools/validate-content.js` loads the
  # classic `data/*.js` scripts with the built-in `vm` module and asks
  # js/core/mistakes.js and js/core/srs.js the questions it cannot answer alone.
  #
  # WHY THERE IS NO `npm ci` HERE, spelled out because it is the reason this job
  # is safe to leave enabled while the test job is off: `npm ci` is the step that
  # took the whole pipeline down once already (a gitignored lockfile), and the
  # lockfile has just been hand-repaired because 48 of its `resolved` URLs
  # pointed at hosts that only exist inside a corporate network — the failure
  # .npmrc documents at length. A job that installs nothing cannot be broken by
  # any of that, and cannot be broken by a future regeneration of the lockfile
  # either. It only needs a Node binary, which setup-node provides. `cache: npm`
  # is likewise omitted: there is nothing to cache.
  #
  # Discovery-based on purpose: it walks data/grammar/*.js and
  # data/pronunciation/*.js rather than naming files, so a point authored next
  # week is validated without anyone editing this workflow.
  #
  # NOT in the deploy job's `needs`, as of 2026-09-12, and this is a decision
  # rather than an oversight. NFR-13 says a malformed content item should fail
  # the build, and the mechanism to make it do so is one line — add `content` to
  # `needs` below. It is left out for now because the validator is RED on arrival
  # against pre-existing content: US-166 (`accept` entries absent from their own
  # `options`) affects 7 items across data/grammar/countability.js and
  # data/grammar/present-perfect.js, and two just-authored points are not yet in
  # index.html or the precache list. Gating the GitHub Pages deploy on defects
  # that predate this job would take the site down to report them. The job is
  # loud instead: it runs on every push and PR, and its failure names every
  # offending item. Add it to `needs` the moment those are closed.
  content:
    name: Content Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Validate authored content
      # Exits non-zero on any error and prints a per-file, per-check report.
      # The same module backs __tests__/unit/content.test.js, so this job and
      # `npm test` can never disagree about what "valid content" means.
      run: node tools/validate-content.js

  # No npm here: this project has no build step and no runtime dependencies
  # (CON-4 in docs/REQUIREMENTS.md). The check is kept so that adding a build
  # script later fails loudly rather than being silently ignored.
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Assert there is still no build step
      run: |
        if grep -q '"build"' package.json; then
          echo "A build script was added. This project is declared no-build-step"
          echo "(CON-4). Update this workflow and docs/REQUIREMENTS.md deliberately."
          exit 1
        fi
        echo "No build script, as expected for a static site."

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [syntax, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # No Node.js or npm setup: the site is plain HTML/CSS/JS served as-is.

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        # `tools` holds Node-only developer scripts (tools/validate-content.js
        # uses `fs` and `vm`). Nothing in index.html references it, so it is
        # excluded rather than published as dead weight on the site.
        exclude_assets: 'node_modules,coverage,__tests__,.git,docs,tools,jest.config.js,package.json,package-lock.json'
        cname: '' # Add your custom domain if needed

